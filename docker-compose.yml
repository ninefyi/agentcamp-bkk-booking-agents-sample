# Docker Compose configuration for MongoDB Atlas + Azure OpenAI Bookings
# Run with: docker-compose up -d

version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    container_name: booking-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_CONNECTION_STRING=${MONGODB_CONNECTION_STRING:-}
      - DATABASE_NAME=${DATABASE_NAME:-db}
      - COLLECTION_NAME=${COLLECTION_NAME:-listings}
      - VECTOR_DIMENSIONS=${VECTOR_DIMENSIONS:-1536}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-10-21}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      - AZURE_OPENAI_CHAT_DEPLOYMENT=${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4o-mini}
    volumes:
      - ./src/api:/app
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: booking-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
